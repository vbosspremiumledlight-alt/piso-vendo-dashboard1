<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Piso Tab Vendo Dashboard</title>
    <style>
        :root {
            --bg: #11151b;
            --panel: rgba(23, 30, 38, 0.9);
            --panel-strong: #1b232d;
            --ink: #f0eee7;
            --muted: #8f9aa6;
            --line: rgba(240, 238, 231, 0.14);
            --red: #ff4655;
            --red-dark: #bd3944;
            --green: #20d489;
            --amber: #f2b84b;
            --cyan: #8de4ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            color: var(--ink);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            background:
                linear-gradient(120deg, rgba(255, 70, 85, 0.12), transparent 32%),
                radial-gradient(circle at 82% 12%, rgba(141, 228, 255, 0.12), transparent 30%),
                var(--bg);
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 46px 46px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent 70%);
        }

        .shell {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 28px 0 36px;
        }

        .topbar {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 18px;
            align-items: center;
            margin-bottom: 22px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 18px;
        }

        h1 {
            font-size: clamp(3.8rem, 13vw, 9.8rem);
            line-height: 0.78;
            text-transform: uppercase;
            letter-spacing: 0.01em;
            text-align: left;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 42px;
            padding: 10px 14px;
            border: 1px solid var(--line);
            background: rgba(240, 238, 231, 0.05);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            color: var(--muted);
            white-space: nowrap;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 999px;
            box-shadow: 0 0 0 5px rgba(255,255,255,0.04);
        }

        .active { background: var(--green); }
        .idle { background: var(--amber); }
        .offline { background: var(--red); }

        .hero {
            position: relative;
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 20px;
            align-items: stretch;
            min-height: 360px;
            margin-bottom: 20px;
        }

        .command-panel,
        .panel,
        .stat-box {
            border: 1px solid var(--line);
            background: var(--panel);
            box-shadow: 0 22px 70px rgba(0, 0, 0, 0.32);
        }

        .command-panel {
            position: relative;
            padding: clamp(22px, 4vw, 42px);
            overflow: hidden;
            clip-path: polygon(0 0, calc(100% - 38px) 0, 100% 38px, 100% 100%, 38px 100%, 0 calc(100% - 38px));
        }

        .command-panel::after {
            content: "VLRNT";
            position: absolute;
            right: -18px;
            bottom: -22px;
            color: rgba(240, 238, 231, 0.035);
            font-size: clamp(5rem, 14vw, 11rem);
            font-weight: 900;
            letter-spacing: -0.08em;
            pointer-events: none;
        }

        .phase-label {
            display: inline-block;
            margin-bottom: 24px;
            padding: 8px 12px;
            color: var(--cyan);
            border-left: 4px solid var(--red);
            background: rgba(141, 228, 255, 0.06);
            text-transform: uppercase;
            font-size: 0.78rem;
            letter-spacing: 0.14em;
            font-weight: 800;
        }

        .timer {
            position: relative;
            z-index: 1;
            font-size: clamp(3.3rem, 11vw, 8.8rem);
            font-weight: 900;
            letter-spacing: 0.02em;
            line-height: 0.85;
            text-transform: uppercase;
            text-shadow: 5px 0 0 rgba(255, 70, 85, 0.45);
        }

        .insert-coins {
            display: none;
            position: relative;
            z-index: 1;
            margin-top: 24px;
            color: var(--red);
            font-size: clamp(1.9rem, 7vw, 5rem);
            font-weight: 900;
            line-height: 0.95;
            text-transform: uppercase;
            animation: alertPulse 1.05s steps(2, end) infinite;
        }

        .no-credit .insert-coins {
            display: block;
        }

        .no-credit .timer {
            color: rgba(240, 238, 231, 0.28);
            text-shadow: none;
        }

        @keyframes alertPulse {
            50% { opacity: 0.42; transform: translateX(4px); }
        }

        .side-stack {
            display: grid;
            gap: 20px;
        }

        .panel {
            padding: 20px;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
        }

        .panel h2,
        .stat-box h3 {
            margin-bottom: 14px;
            color: var(--muted);
            font-size: 0.78rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .credit-value {
            font-size: clamp(2.6rem, 8vw, 5.5rem);
            font-weight: 900;
            line-height: 0.9;
        }

        .credit-unit {
            color: var(--red);
            font-size: 1rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }

        .stat-box {
            min-height: 136px;
            padding: 18px;
            background: linear-gradient(145deg, rgba(255,255,255,0.07), rgba(255,255,255,0.015)), var(--panel-strong);
        }

        .stat-value {
            font-size: clamp(1.8rem, 5vw, 3.1rem);
            font-weight: 900;
        }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        button {
            min-height: 48px;
            border: 0;
            color: var(--ink);
            background: var(--red);
            font: inherit;
            font-weight: 900;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            transition: transform 180ms ease, background 180ms ease, filter 180ms ease;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        button:active {
            transform: translateY(1px);
        }

        button.secondary {
            background: rgba(240, 238, 231, 0.12);
            border: 1px solid var(--line);
        }

        button.danger {
            background: #2b3139;
            color: var(--red);
            border: 1px solid rgba(255, 70, 85, 0.42);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr)) auto;
            gap: 12px;
            align-items: end;
        }

        label {
            display: grid;
            gap: 8px;
            color: var(--muted);
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            min-height: 48px;
            border: 1px solid var(--line);
            border-radius: 0;
            padding: 0 12px;
            color: var(--ink);
            background: rgba(240, 238, 231, 0.07);
            font: inherit;
            font-size: 1.15rem;
        }

        .creator-credit {
            margin-top: 22px;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 0.16em;
            text-align: center;
            text-transform: uppercase;
        }

        @media (max-width: 820px) {
            .topbar,
            .hero,
            .stats,
            .settings-grid,
            .control-grid {
                grid-template-columns: 1fr;
            }

            .status-chip {
                width: 100%;
                justify-content: flex-start;
            }

            .command-panel {
                min-height: 330px;
            }

            h1 {
                font-size: clamp(3.2rem, 21vw, 6.4rem);
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <div>
                <h1>Piso Tab</h1>
            </div>
            <div id="connectionStatus" class="status-chip">
                <span class="status-indicator offline"></span>
                <span>Checking connection...</span>
            </div>
        </header>

        <section class="hero">
            <div class="command-panel no-credit" id="commandPanel">
                <span class="phase-label" id="phaseLabel">Awaiting credits</span>
                <div class="timer" id="timerDisplay">--:--:--</div>
                <div class="insert-coins" id="insertCoins">Insert Coins</div>
            </div>

            <div class="side-stack">
                <section class="panel">
                    <h2>Credit Balance</h2>
                    <div class="credit-value"><span id="creditBalance">0</span></div>
                    <div class="credit-unit">coins available</div>
                </section>

                <section class="panel">
                    <h2>Machine Status</h2>
                    <div class="stat-value" id="machineStatus">Idle</div>
                </section>
            </div>
        </section>

        <section class="stats">
            <div class="stat-box">
                <h3>Today's Earnings</h3>
                <div class="stat-value">₱<span id="earnings">0</span></div>
            </div>
            <div class="stat-box">
                <h3>Total Sessions</h3>
                <div class="stat-value" id="totalSessions">0</div>
            </div>
            <div class="stat-box">
                <h3>Required Coins</h3>
                <div class="stat-value" id="requiredCoinsDisplay">5</div>
            </div>
        </section>

        <section class="panel">
            <h2>Quick Controls</h2>
            <div class="control-grid">
                <button onclick="sendCommand('start')">Start</button>
                <button onclick="sendCommand('stop')" class="danger">Stop</button>
                <button onclick="sendCommand('reset')" class="secondary">Reset</button>
            </div>
        </section>

        <section class="panel" style="margin-top: 20px;">
            <h2>Settings</h2>
            <div class="settings-grid">
                <label>
                    Coins Required
                    <input type="number" id="coinsRequired" value="5" min="0">
                </label>
                <label>
                    Minutes per Coin
                    <input type="number" id="minutesPerCoin" value="5" min="1">
                </label>
                <button onclick="updateSettings()">Update</button>
            </div>
        </section>

        <footer class="creator-credit">Created By BossV</footer>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

    <script>
        let currentCredit = 0;

        function setConnectionStatus(state, text) {
            document.getElementById('connectionStatus').innerHTML =
                '<span class="status-indicator ' + state + '"></span><span>' + text + '</span>';
        }

        function setCreditBalance(value) {
            currentCredit = Math.max(0, Number(value) || 0);
            document.getElementById('creditBalance').textContent = currentCredit;
            document.getElementById('commandPanel').classList.toggle('no-credit', currentCredit <= 0);
            document.getElementById('phaseLabel').textContent = currentCredit <= 0 ? 'Awaiting credits' : 'Credits loaded';
        }

        const client = new Paho.MQTT.Client("broker.hivemq.com", 8000, "dashboard_" + Math.random().toString(16));

        client.onConnectionLost = function() {
            console.log("Connection lost");
            setConnectionStatus('offline', 'Disconnected');
        };

        client.onMessageArrived = function(message) {
            console.log("Message: " + message.destinationName + " = " + message.payloadString);

            if (message.destinationName == "pisoVendo/status") {
                let status = message.payloadString;
                document.getElementById('machineStatus').textContent = status;

                if (status == "active") {
                    setConnectionStatus('active', 'Machine Active');
                    document.getElementById('phaseLabel').textContent = currentCredit <= 0 ? 'Awaiting credits' : 'Session active';
                } else {
                    setConnectionStatus('idle', 'Machine Idle');
                }
            }

            if (message.destinationName == "pisoVendo/earnings") {
                document.getElementById('earnings').textContent = message.payloadString;
            }

            if (message.destinationName == "pisoVendo/credit" || message.destinationName == "pisoVendo/coins") {
                setCreditBalance(message.payloadString);
            }

            if (message.destinationName == "pisoVendo/sessions") {
                document.getElementById('totalSessions').textContent = message.payloadString;
            }

            if (message.destinationName == "pisoVendo/timer") {
                document.getElementById('timerDisplay').textContent = message.payloadString;
            }
        };

        client.connect({
            onSuccess: function() {
                console.log("Connected to MQTT");
                client.subscribe("pisoVendo/status");
                client.subscribe("pisoVendo/earnings");
                client.subscribe("pisoVendo/credit");
                client.subscribe("pisoVendo/coins");
                client.subscribe("pisoVendo/sessions");
                client.subscribe("pisoVendo/timer");
                setConnectionStatus('active', 'Connected');
                setCreditBalance(0);
            },
            onFailure: function(error) {
                console.log("Connection failed: " + error);
                setConnectionStatus('offline', 'Connection failed');
            }
        });

        function sendCommand(command) {
            let message = new Paho.MQTT.Message(command);
            message.destinationName = "pisoVendo/command";
            client.send(message);
            console.log("Sent command: " + command);
        }

        function updateSettings() {
            let coins = document.getElementById('coinsRequired').value;
            let minutes = document.getElementById('minutesPerCoin').value;
            let settings = JSON.stringify({coins: coins, minutes: minutes});

            document.getElementById('requiredCoinsDisplay').textContent = coins;

            let message = new Paho.MQTT.Message(settings);
            message.destinationName = "pisoVendo/settings";
            client.send(message);

            alert("Settings updated!");
        }
    </script>
</body>
</html>
