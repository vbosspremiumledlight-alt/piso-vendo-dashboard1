<!DOCTYPE html>
<html>
<head>
    <title>Piso Tab Vendo Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .status-indicator {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .active { background: #4CAF50; }
        .idle { background: #FFA500; }
        .offline { background: #f44336; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .stat-box {
            background: rgba(255,255,255,0.2);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin: 10px 0;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin: 5px;
        }
        button.danger { background: #f44336; }
        button:hover { opacity: 0.8; }
        .timer { font-size: 3em; text-align: center; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Piso Tab Vendo Kiosk</h1>
            <p>Dashboard & Control Panel</p>
        </div>

        <div class="card">
            <h2>Machine Status</h2>
            <div id="connectionStatus">
                <span class="status-indicator offline"></span>
                <span>Checking connection...</span>
            </div>
        </div>

        <div class="card">
            <h2>Session Timer</h2>
            <div class="timer" id="timerDisplay">--:--:--</div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <h3>Today's Earnings</h3>
                <div class="stat-value">₱<span id="earnings">0</span></div>
            </div>
            <div class="stat-box">
                <h3>Total Sessions</h3>
                <div class="stat-value" id="totalSessions">0</div>
            </div>
            <div class="stat-box">
                <h3>Machine Status</h3>
                <div class="stat-value" id="machineStatus">Idle</div>
            </div>
        </div>

        <div class="card">
            <h2>Quick Controls</h2>
            <button onclick="sendCommand('start')">Start Session</button>
            <button onclick="sendCommand('stop')" class="danger">Stop Session</button>
            <button onclick="sendCommand('reset')">Reset Counter</button>
        </div>

        <div class="card">
            <h2>Settings</h2>
            <label>Coins Required:</label>
            <input type="number" id="coinsRequired" value="5" style="width:80px;padding:5px;margin:10px;">
            <br>
            <label>Minutes per Coin:</label>
            <input type="number" id="minutesPerCoin" value="5" style="width:80px;padding:5px;margin:10px;">
            <br>
            <button onclick="updateSettings()">Update Settings</button>
        </div>
    </div>

    <!-- MQTT JavaScript Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    
    <script>
        // MQTT Connection
        const client = new Paho.MQTT.Client("broker.hivemq.com", 8000, "dashboard_" + Math.random().toString(16));
        
        client.onConnectionLost = function(responseObject) {
            console.log("Connection lost");
            document.getElementById('connectionStatus').innerHTML = 
                '<span class="status-indicator offline"></span><span>Disconnected</span>';
        };
        
        client.onMessageArrived = function(message) {
            console.log("Message: " + message.destinationName + " = " + message.payloadString);
            
            if (message.destinationName == "pisoVendo/status") {
                let status = message.payloadString;
                document.getElementById('machineStatus').textContent = status;
                
                if (status == "active") {
                    document.getElementById('connectionStatus').innerHTML = 
                        '<span class="status-indicator active"></span><span>Machine Active</span>';
                } else {
                    document.getElementById('connectionStatus').innerHTML = 
                        '<span class="status-indicator idle"></span><span>Machine Idle</span>';
                }
            }
            
            if (message.destinationName == "pisoVendo/earnings") {
                document.getElementById('earnings').textContent = message.payloadString;
            }
        };
        
        // Connect to MQTT
        client.connect({
            onSuccess: function() {
                console.log("Connected to MQTT");
                client.subscribe("pisoVendo/status");
                client.subscribe("pisoVendo/earnings");
                document.getElementById('connectionStatus').innerHTML = 
                    '<span class="status-indicator active"></span><span>Connected</span>';
            },
            onFailure: function(error) {
                console.log("Connection failed: " + error);
            }
        });
        
        function sendCommand(command) {
            let message = new Paho.MQTT.Message(command);
            message.destinationName = "pisoVendo/command";
            client.send(message);
            console.log("Sent command: " + command);
        }
        
        function updateSettings() {
            let coins = document.getElementById('coinsRequired').value;
            let minutes = document.getElementById('minutesPerCoin').value;
            let settings = JSON.stringify({coins: coins, minutes: minutes});
            
            let message = new Paho.MQTT.Message(settings);
            message.destinationName = "pisoVendo/settings";
            client.send(message);
            
            alert("Settings updated!");
        }
    </script>
</body>
</html>
